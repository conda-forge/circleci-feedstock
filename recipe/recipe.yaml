context:
  version: "1.1.0"

package:
  name: circleci
  version: ${{ version }}

source:
  url: https://github.com/CircleCI-Public/circleci-cli/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ac40bf24ffa682013fe6b4f0e6d4ce11610aeae536aae51d51f721396c61611c

build:
  number: 0
  script:
    - if: unix
      then:
        - |
          go-licenses save ./cmd/circleci --save_path library_licenses \
          --ignore github.com/alecthomas/chroma/v2 \
          --ignore github.com/segmentio/asm
        - cp -r ${RECIPE_DIR}/library_licenses/* ${SRC_DIR}/library_licenses
        - go build -v -o $PREFIX/bin/circleci -ldflags="-s -w" ./cmd/circleci
      else:
    # Manually copy licenses that go-licenses could not download
        - go-licenses save .\cmd\circleci --save_path library_licenses ^ --ignore github.com/alecthomas/chroma/v2 ^ --ignore github.com/segmentio/asm
        - xcopy /s %RECIPE_DIR%\library_licenses\* %SRC_DIR%\library_licenses
        - go build -v -o %LIBRARY_BIN%\circleci.exe -ldflags="-s" .\cmd\circleci
requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      env:
        CIRCLE_NO_TELEMETRY: "1"
      content:
        - circleci version
        - circleci help

about:
  homepage: https://circleci-public.github.io/circleci-cli/
  summary: CircleCI's command-line application.
  license: MIT
  license_file:
    - LICENSE
    - library_licenses/

extra:
  recipe-maintainers:
    - lucascolley
